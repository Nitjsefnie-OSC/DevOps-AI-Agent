# OSC fork CI wrapper - generated by scripts/make_wrapper.py;
# check with scripts/verify_wrapper.py before pushing.
# Jobs kept (verbatim, except the two sanctioned adaptations:
# checkout pinned to ${{ inputs.target_ref }}, and the inserted
# Provenance step):
#   - lint
#   - test
#   - test-collectors
#   - test-tools
#   - integration-test
#   - security-scan
#   - docker-build
#   - docs
# DELIBERATELY EXCLUDED (loud):
#   - none

name: OSC manual CI

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Git branch, tag, or 40-character commit SHA to validate'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: osc-manual-${{ github.repository }}-${{ inputs.target_ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.target_ref }}
    - name: Provenance
      shell: bash
      run: |
        set -euo pipefail
        echo "tested_target_ref=${{ inputs.target_ref }}"
        checked_out_sha="$(git rev-parse HEAD)"
        if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
          exit 1
        fi
        printf 'checked-out SHA: %s\n' "$checked_out_sha"
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black flake8 pylint
        pip install -r requirements.txt
    - name: Run Black
      run: black --check .
      continue-on-error: true
    - name: Run Flake8
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
  test:
    name: Test Agent with Dummy Data
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
        - '3.10'
        - '3.11'
        - '3.12'
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.target_ref }}
    - name: Provenance
      shell: bash
      run: |
        set -euo pipefail
        echo "tested_target_ref=${{ inputs.target_ref }}"
        checked_out_sha="$(git rev-parse HEAD)"
        if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
          exit 1
        fi
        printf 'checked-out SHA: %s\n' "$checked_out_sha"
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-mock
    - name: Create dummy .env file
      run: |
        cat > .env << EOF
        ANTHROPIC_API_KEY=dummy-key-for-testing
        SLACK_WEBHOOK_URL=https://hooks.slack.com/services/dummy/webhook/url
        SLACK_APPROVAL_CHANNEL=test-approvals
        GITHUB_TOKEN=ghp_dummy_token_for_testing
        AUTO_APPLY=false
        MAX_AGENT_STEPS=10
        ALLOWED_NAMESPACES=default,test
        GITLAB_TOKEN=dummy-gitlab-token
        JENKINS_URL=http://jenkins.test
        JENKINS_USERNAME=test
        JENKINS_API_TOKEN=dummy
        BAMBOO_URL=http://bamboo.test
        BAMBOO_USERNAME=test
        BAMBOO_PASSWORD=dummy
        AZURE_DEVOPS_ORG=test-org
        AZURE_DEVOPS_PAT=dummy
        ARGOCD_SERVER_URL=argocd.test
        ARGOCD_AUTH_TOKEN=dummy
        AWS_ACCESS_KEY_ID=dummy
        AWS_SECRET_ACCESS_KEY=dummy
        AWS_REGION=us-east-1
        GCP_PROJECT_ID=test-project
        AZURE_SUBSCRIPTION_ID=dummy
        AZURE_TENANT_ID=dummy
        AZURE_CLIENT_ID=dummy
        AZURE_CLIENT_SECRET=dummy
        EOF
    - name: Run Unit Tests
      run: |
        pytest tests/ -v --cov=. --cov-report=xml --cov-report=term
      env:
        TESTING: true
    - name: Upload Coverage
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
  test-collectors:
    name: Test Collectors with Dummy Data
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.target_ref }}
    - name: Provenance
      shell: bash
      run: |
        set -euo pipefail
        echo "tested_target_ref=${{ inputs.target_ref }}"
        checked_out_sha="$(git rev-parse HEAD)"
        if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
          exit 1
        fi
        printf 'checked-out SHA: %s\n' "$checked_out_sha"
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-mock
    - name: Create test environment
      run: |
        cat > .env << EOF
        ANTHROPIC_API_KEY=sk-ant-dummy-key-123
        GITHUB_TOKEN=ghp_dummy_token
        SLACK_WEBHOOK_URL=https://hooks.slack.com/dummy
        EOF
    - name: Test K8s Collector (Mock)
      run: "python -c \"\nimport sys\nsys.path.insert(0, '.')\nfrom collectors.k8s\
        \ import K8sCollector\n\ncollector = K8sCollector()\nprint('K8s Collector\
        \ initialized successfully')\nprint('\u2713 K8s collector test passed')\n\"\
        \n"
    - name: Test GitHub Collector (Mock)
      run: "python -c \"\nimport sys\nsys.path.insert(0, '.')\nfrom collectors.github\
        \ import GitHubCollector\n\ncollector = GitHubCollector()\nprint('GitHub Collector\
        \ initialized successfully')\nprint('\u2713 GitHub collector test passed')\n\
        \"\n"
    - name: Test GitLab Collector (Mock)
      run: "python -c \"\nimport sys\nimport os\nsys.path.insert(0, '.')\nos.environ['GITLAB_TOKEN']\
        \ = 'dummy-token'\nfrom collectors.gitlab import GitLabCollector\n\ncollector\
        \ = GitLabCollector()\nassert collector.token, 'GitLab collector did not read\
        \ GITLAB_TOKEN'\nprint('GitLab Collector initialized successfully')\nprint('\u2713\
        \ GitLab collector test passed')\n\"\n"
    - name: Test ArgoCD Collector (Mock)
      run: "python -c \"\nimport sys\nimport os\nsys.path.insert(0, '.')\nos.environ['ARGOCD_SERVER_URL']\
        \ = 'argocd.test'\nos.environ['ARGOCD_AUTH_TOKEN'] = 'dummy-token'\nfrom collectors.argocd\
        \ import ArgoCDCollector\n\ncollector = ArgoCDCollector()\nassert collector.server_url\
        \ == 'argocd.test', 'ArgoCD collector did not read ARGOCD_SERVER_URL'\nassert\
        \ collector.auth_token == 'dummy-token', 'ArgoCD collector did not read ARGOCD_AUTH_TOKEN'\n\
        print('ArgoCD Collector initialized successfully')\nprint('\u2713 ArgoCD collector\
        \ test passed')\n\"\n"
  test-tools:
    name: Test Tools with Dummy Data
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.target_ref }}
    - name: Provenance
      shell: bash
      run: |
        set -euo pipefail
        echo "tested_target_ref=${{ inputs.target_ref }}"
        checked_out_sha="$(git rev-parse HEAD)"
        if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
          exit 1
        fi
        printf 'checked-out SHA: %s\n' "$checked_out_sha"
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-mock
    - name: Test Safe Executor
      run: "python -c \"\nimport sys\nsys.path.insert(0, '.')\nfrom tools.executor\
        \ import SafeExecutor\n\nexecutor = SafeExecutor()\n\n# Test _classify: read-only\
        \ commands are safe\nassert executor._classify('kubectl get pods') == 'safe',\
        \ 'Expected safe'\nassert executor._classify('kubectl describe pod myapp')\
        \ == 'safe', 'Expected safe'\nassert executor._classify('kubectl logs myapp')\
        \ == 'safe', 'Expected safe'\nprint('\u2713 Safe executor classify safe commands\
        \ test passed')\n\n# Test _classify: mutating commands require approval (AUTO_APPLY=false\
        \ by default)\nassert executor._classify('kubectl delete pod myapp') == 'requires_approval',\
        \ 'Expected requires_approval'\nassert executor._classify('kubectl exec myapp\
        \ -- bash') == 'requires_approval', 'Expected requires_approval'\nassert executor._classify('rm\
        \ -rf /tmp/test') == 'requires_approval', 'Expected requires_approval'\nprint('\u2713\
        \ Safe executor classify dangerous commands test passed')\n\n# Test _classify:\
        \ allowed-with-auto-apply commands\nassert executor._classify('kubectl rollout\
        \ restart deployment/myapp') == 'allowed', 'Expected allowed'\nassert executor._classify('kubectl\
        \ apply -f manifest.yaml') == 'allowed', 'Expected allowed'\nprint('\u2713\
        \ Safe executor classify allowed commands test passed')\n\n# Test run_safe\
        \ blocks requires_approval commands when AUTO_APPLY=false\nimport asyncio\n\
        async def test_run_safe():\n    result = await executor.run_safe('kubectl\
        \ delete pod myapp')\n    assert result.get('blocked') == True, f'Expected\
        \ blocked=True, got: {result}'\n    assert result.get('requires_approval')\
        \ == True, 'Expected requires_approval=True'\n    assert 'approval_payload'\
        \ in result, 'Expected approval_payload in result'\n    print('\u2713 Safe\
        \ executor run_safe blocks dangerous commands test passed')\n\n    result\
        \ = await executor.run_safe('kubectl apply -f manifest.yaml')\n    assert\
        \ result.get('blocked') == True, f'Expected blocked when AUTO_APPLY=false,\
        \ got: {result}'\n    print('\u2713 Safe executor run_safe blocks allowed\
        \ commands without AUTO_APPLY test passed')\n\nasyncio.run(test_run_safe())\n\
        \"\n"
    - name: Test K8s Tools (Mock)
      run: "python -c \"\nimport sys\nimport asyncio\nsys.path.insert(0, '.')\nfrom\
        \ tools.k8s_tools import K8sTools\n\nasync def test():\n    tools = K8sTools()\n\
        \    print('K8sTools initialized successfully')\n\n    # Test namespace not\
        \ in ALLOWED_NAMESPACES is blocked\n    result = tools._check_namespace('not-allowed-ns')\n\
        \    if result:\n        assert result['blocked'] == True\n        print('\u2713\
        \ K8s tools namespace block test passed')\n    else:\n        print('\u2713\
        \ K8s tools namespace check passed (namespace allowed)')\n\n    # Test allowed\
        \ namespace passes check\n    result = tools._check_namespace('default')\n\
        \    assert result is None, f'Expected None for allowed namespace, got: {result}'\n\
        \    print('\u2713 K8s tools allowed namespace test passed')\n\nasyncio.run(test())\n\
        \"\n"
  integration-test:
    name: Integration Test - Full Agent Flow
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.target_ref }}
    - name: Provenance
      shell: bash
      run: |
        set -euo pipefail
        echo "tested_target_ref=${{ inputs.target_ref }}"
        checked_out_sha="$(git rev-parse HEAD)"
        if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
          exit 1
        fi
        printf 'checked-out SHA: %s\n' "$checked_out_sha"
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio httpx
    - name: Create test configuration
      run: |
        cat > .env << EOF
        ANTHROPIC_API_KEY=sk-ant-dummy-key-for-integration-test
        SLACK_WEBHOOK_URL=https://hooks.slack.com/services/dummy
        GITHUB_TOKEN=ghp_dummy
        AUTO_APPLY=false
        TESTING=true
        EOF
    - name: Start API Server (Background)
      run: |
        uvicorn api.server:app --host 0.0.0.0 --port 8000 &
        sleep 5
      env:
        TESTING: true
        API_ADMIN_TOKEN: ci-admin-token
    - name: Test Health Endpoint
      run: "curl -f http://localhost:8000/health || exit 1\necho \"\u2713 Health endpoint\
        \ test passed\"\n"
    - name: Test Manual Webhook - K8s Incident (Dummy)
      run: "body_file=$(mktemp)\nstatus=$(curl -sS -o \"$body_file\" -w '%{http_code}'\
        \ -X POST http://localhost:8000/webhook/manual \\\n  -H \"Content-Type: application/json\"\
        \ \\\n  -d '{\n    \"type\": \"k8s\",\n    \"namespace\": \"test\",\n    \"\
        pod_name\": \"dummy-pod\",\n    \"labels\": {\"severity\": \"warning\", \"\
        test\": \"true\"}\n  }') || { echo \"curl failed (HTTP ${status:-none})\"\
        ; exit 1; }\nbody=$(cat \"$body_file\")\nif [ \"$status\" != \"200\" ] ||\
        \ ! jq -e --arg type k8s \\\n  '.status == \"queued\" and (.incident_id |\
        \ type == \"string\" and length > 0) and .context.type == $type and .context.source\
        \ == \"manual\"' \\\n  <<<\"$body\" >/dev/null; then\n  echo \"::error::Unexpected\
        \ response: HTTP $status, body: $body\"\n  exit 1\nfi\necho \"\u2713 K8s manual\
        \ webhook queued: $body\"\n"
    - name: Test Manual Webhook - CI/CD Incident (Dummy)
      run: "body_file=$(mktemp)\nstatus=$(curl -sS -o \"$body_file\" -w '%{http_code}'\
        \ -X POST http://localhost:8000/webhook/manual \\\n  -H \"Content-Type: application/json\"\
        \ \\\n  -d '{\n    \"type\": \"cicd\",\n    \"source\": \"github_actions\"\
        ,\n    \"repo\": \"test/repo\",\n    \"run_id\": 12345,\n    \"labels\": {\"\
        test\": \"true\"}\n  }') || { echo \"curl failed (HTTP ${status:-none})\"\
        ; exit 1; }\nbody=$(cat \"$body_file\")\nif [ \"$status\" != \"200\" ] ||\
        \ ! jq -e --arg type cicd \\\n  '.status == \"queued\" and (.incident_id |\
        \ type == \"string\" and length > 0) and .context.type == $type and .context.source\
        \ == \"manual\"' \\\n  <<<\"$body\" >/dev/null; then\n  echo \"::error::Unexpected\
        \ response: HTTP $status, body: $body\"\n  exit 1\nfi\necho \"\u2713 CI/CD\
        \ manual webhook queued: $body\"\n"
    - name: Test Manual Webhook - ArgoCD Incident (Dummy)
      run: "body_file=$(mktemp)\nstatus=$(curl -sS -o \"$body_file\" -w '%{http_code}'\
        \ -X POST http://localhost:8000/webhook/manual \\\n  -H \"Content-Type: application/json\"\
        \ \\\n  -d '{\n    \"type\": \"argocd\",\n    \"app_name\": \"test-app\",\n\
        \    \"labels\": {\"test\": \"true\"}\n  }') || { echo \"curl failed (HTTP\
        \ ${status:-none})\"; exit 1; }\nbody=$(cat \"$body_file\")\nif [ \"$status\"\
        \ != \"200\" ] || ! jq -e --arg type argocd \\\n  '.status == \"queued\" and\
        \ (.incident_id | type == \"string\" and length > 0) and .context.type ==\
        \ $type and .context.source == \"manual\"' \\\n  <<<\"$body\" >/dev/null;\
        \ then\n  echo \"::error::Unexpected response: HTTP $status, body: $body\"\
        \n  exit 1\nfi\necho \"\u2713 ArgoCD manual webhook queued: $body\"\n"
    - name: Test Manual Webhook - Missing Type Rejected
      run: "body_file=$(mktemp)\nstatus=$(curl -sS -o \"$body_file\" -w '%{http_code}'\
        \ -X POST http://localhost:8000/webhook/manual \\\n  -H \"Content-Type: application/json\"\
        \ \\\n  -d '{\"namespace\": \"test\", \"labels\": {\"test\": \"true\"}}')\
        \ || { echo \"curl failed (HTTP ${status:-none})\"; exit 1; }\nbody=$(cat\
        \ \"$body_file\")\nif [ \"$status\" != \"400\" ] || ! jq -e --arg detail \"\
        'type' field required\" '.detail == $detail' <<<\"$body\" >/dev/null; then\n\
        \  echo \"::error::Unexpected response: HTTP $status, body: $body\"\n  exit\
        \ 1\nfi\necho \"\u2713 Missing type rejected: $body\"\n"
    - name: Test Manual Webhook - Invalid JSON Rejected
      run: "body_file=$(mktemp)\nstatus=$(curl -sS -o \"$body_file\" -w '%{http_code}'\
        \ -X POST http://localhost:8000/webhook/manual \\\n  -H \"Content-Type: application/json\"\
        \ \\\n  -d 'not json') || { echo \"curl failed (HTTP ${status:-none})\"; exit\
        \ 1; }\nbody=$(cat \"$body_file\")\nif [ \"$status\" != \"400\" ] || ! jq\
        \ -e --arg detail \"JSON object required\" '.detail == $detail' <<<\"$body\"\
        \ >/dev/null; then\n  echo \"::error::Unexpected response: HTTP $status, body:\
        \ $body\"\n  exit 1\nfi\necho \"\u2713 Invalid JSON rejected: $body\"\n"
    - name: Check Audit Endpoint
      run: "status=$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8000/audit)\n\
        if [ \"$status\" != \"401\" ]; then\n  echo \"::error::Unauthenticated /audit\
        \ returned HTTP $status, expected 401\"\n  exit 1\nfi\ncurl -f -H \"Authorization:\
        \ Bearer ci-admin-token\" http://localhost:8000/audit || exit 1\necho \"\u2713\
        \ Audit endpoint requires a token and works with one\"\n"
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.target_ref }}
    - name: Provenance
      shell: bash
      run: |
        set -euo pipefail
        echo "tested_target_ref=${{ inputs.target_ref }}"
        checked_out_sha="$(git rev-parse HEAD)"
        if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
          exit 1
        fi
        printf 'checked-out SHA: %s\n' "$checked_out_sha"
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit
    - name: Run Safety Check
      run: |
        pip install -r requirements.txt
        safety check || true
    - name: Run Bandit Security Scan
      run: |
        bandit -r . -f json -o bandit-report.json || true
        bandit -r . -ll
    - name: Upload Bandit Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bandit-security-report
        path: bandit-report.json
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.target_ref }}
    - name: Provenance
      shell: bash
      run: |
        set -euo pipefail
        echo "tested_target_ref=${{ inputs.target_ref }}"
        checked_out_sha="$(git rev-parse HEAD)"
        if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
          exit 1
        fi
        printf 'checked-out SHA: %s\n' "$checked_out_sha"
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build Docker Image
      run: |
        docker build -t devops-ai-agent:test -f docker/Dockerfile .
    - name: Test Docker Image
      run: |
        docker run --rm devops-ai-agent:test python --version
        docker run --rm devops-ai-agent:test pip list | grep anthropic
  docs:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.target_ref }}
    - name: Provenance
      shell: bash
      run: |
        set -euo pipefail
        echo "tested_target_ref=${{ inputs.target_ref }}"
        checked_out_sha="$(git rev-parse HEAD)"
        if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
          exit 1
        fi
        printf 'checked-out SHA: %s\n' "$checked_out_sha"
    - name: Check Required Files
      run: "test -f README.md && echo \"\u2713 README.md exists\"\ntest -f LICENSE\
        \ && echo \"\u2713 LICENSE exists\"\ntest -f .env.example && echo \"\u2713\
        \ .env.example exists\"\ntest -f requirements.txt && echo \"\u2713 requirements.txt\
        \ exists\"\ntest -f CONTRIBUTING.md && echo \"\u2713 CONTRIBUTING.md exists\"\
        \ntest -f docs/MULTI_PLATFORM_GUIDE.md && echo \"\u2713 docs/MULTI_PLATFORM_GUIDE.md\
        \ exists\"\n"
    - name: Check Python Documentation
      run: |-
        python -m pip install pydocstyle
        pydocstyle agent/ || true
        pydocstyle collectors/ || true
        pydocstyle tools/ || true
